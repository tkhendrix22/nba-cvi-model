name: Daily Stats Update

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas numpy scikit-learn lxml html5lib

      - name: Run update script
        run: python update_current_season.py

      - name: Commit updated data
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add data/processed/master_scored.csv
          git diff --staged --quiet || git commit -m "daily update $(date +%Y-%m-%d)"
          git push
